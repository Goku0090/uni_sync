version: '3.9'

services:
  # Backend - Django REST API
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.backend
    container_name: unisync-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=sqlite:///db.sqlite3
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://localhost
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - backend_staticfiles:/app/staticfiles
    networks:
      - unisync-network
    command: gunicorn auth_project.wsgi --bind 0.0.0.0:8000 --workers 4 --timeout 120
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - React SPA
  frontend:
    build:
      context: ./frontend
    container_name: unisync-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - unisync-network
    environment:
      - VITE_API_URL=http://backend:8000/api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: unisync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unisync-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  backend_staticfiles:

networks:
  unisync-network:
    driver: bridge
