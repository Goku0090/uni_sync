<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | UniSinq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="{% static 'css/messages.css' %}">
</head>
<body>
    <!-- Main Container -->
    <div class="h-screen flex flex-col">
        <!-- Header Navigation -->
        <nav class="glass-effect sticky top-0 z-40 px-4 py-3 sm:px-6 sm:py-4">
            <div class="flex items-center justify-between max-w-7xl mx-auto">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-lg">U</span>
                    </div>
                    <div class="hidden sm:block">
                        <h1>Messages</h1>
                        <p class="text-sm">Stay connected with your team</p>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-sm mx-4 hidden sm:block">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="searchInput"
                            placeholder="Search conversations..." 
                            class="search-input w-full px-4 py-2 pl-10 rounded-lg"
                            autocomplete="off"
                        >
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-2 sm:gap-4">
                    <!-- Mobile Search -->
                    <button onclick="toggleSearch()" class="sm:hidden p-2 hover:bg-gray-700 rounded-lg transition">
                        <i data-lucide="search" class="w-5 h-5 text-gray-300"></i>
                    </button>

                    <!-- Notification Bell -->
                    <button class="relative p-2 hover:bg-gray-700 rounded-lg transition" title="Notifications">
                        <i data-lucide="bell" class="w-5 h-5 text-gray-300"></i>
                        <span class="notification-dot absolute top-1 right-1 w-3 h-3 rounded-full"></span>
                    </button>

                    <!-- Settings Menu -->
                    <div class="relative">
                        <button onclick="toggleSettingsMenu()" class="p-2 hover:bg-gray-700 rounded-lg transition">
                            <i data-lucide="more-vertical" class="w-5 h-5 text-gray-300"></i>
                        </button>
                        <div id="settingsMenu" class="hidden absolute right-0 mt-2 w-48 rounded-lg shadow-lg border border-gray-600 py-1">
                            <button onclick="toggleDarkMode()" class="w-full text-left px-4 py-2 hover:bg-gray-700 transition flex items-center gap-2">
                                <i data-lucide="moon" class="w-4 h-4"></i>
                                Toggle Dark Mode
                            </button>
                            <button onclick="toggleNotifications()" class="w-full text-left px-4 py-2 hover:bg-gray-700 transition flex items-center gap-2">
                                <i data-lucide="volume-2" class="w-4 h-4"></i>
                                Notifications
                            </button>
                            <button onclick="showKeyboardShortcuts()" class="w-full text-left px-4 py-2 hover:bg-gray-700 transition flex items-center gap-2">
                                <i data-lucide="keyboard" class="w-4 h-4"></i>
                                Keyboard Shortcuts
                            </button>
                        </div>
                    </div>

                    <!-- Mobile Menu -->
                    <button onclick="toggleMobileMenu()" class="sm:hidden p-2 hover:bg-gray-700 rounded-lg transition">
                        <i data-lucide="menu" class="w-5 h-5 text-gray-300"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Conversations Sidebar -->
            <div id="conversationsSidebar" class="w-full sm:w-96 bg-gray-900 border-r border-gray-700 flex flex-col">
                <!-- Sidebar Header -->
                <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                    <h2 class="font-bold text-lg">Conversations</h2>
                    <button onclick="showNewMessageModal()" class="p-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition" title="New message">
                        <i data-lucide="plus" class="w-5 h-5 text-white"></i>
                    </button>
                </div>

                <!-- Conversation List -->
                <div class="flex-1 overflow-y-auto" id="conversationList">
                    <div class="p-4 text-center text-gray-400">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p>No conversations yet</p>
                    </div>
                </div>

                <!-- Group Chat Button -->
                <div class="p-4 border-t border-gray-700">
                    <button onclick="showGroupChatModal()" class="w-full px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white rounded-lg transition flex items-center justify-center gap-2">
                        <i data-lucide="users" class="w-4 h-4"></i>
                        New Group Chat
                    </button>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="hidden sm:flex flex-1 flex-col bg-gray-800">
                <!-- Chat Header -->
                <div id="chatHeader" class="p-4 border-b border-gray-700 flex items-center justify-between">
                    <div id="chatHeaderContent" class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center">
                            <i data-lucide="message-circle" class="w-5 h-5 text-gray-400"></i>
                        </div>
                        <div>
                            <h3 id="chatName" class="font-semibold text-white">Select a conversation</h3>
                            <p id="chatStatus" class="text-xs text-gray-400">Online</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="p-2 hover:bg-gray-700 rounded-lg transition" title="Call">
                            <i data-lucide="phone" class="w-5 h-5 text-gray-300"></i>
                        </button>
                        <button class="p-2 hover:bg-gray-700 rounded-lg transition" title="Video call">
                            <i data-lucide="video" class="w-5 h-5 text-gray-300"></i>
                        </button>
                        <button class="p-2 hover:bg-gray-700 rounded-lg transition" title="Info">
                            <i data-lucide="info" class="w-5 h-5 text-gray-300"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <div class="text-center text-gray-400 py-8">
                        <i data-lucide="message-circle" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                        <p>Select a conversation to start messaging</p>
                    </div>
                </div>

                <!-- Message Input -->
                <div class="p-4 border-t border-gray-700">
                    <div class="flex gap-3 items-end">
                        <input 
                            type="text"
                            id="messageInput"
                            placeholder="Type your message..."
                            class="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                            autocomplete="off"
                        >
                        <button onclick="attachFile()" class="p-2 hover:bg-gray-700 rounded-lg transition" title="Attach file">
                            <i data-lucide="paperclip" class="w-5 h-5 text-gray-300"></i>
                        </button>
                        <button onclick="sendMessage()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div id="typingIndicator" class="mt-2 text-sm text-gray-400 hidden">
                        <i data-lucide="loader" class="w-4 h-4 inline animate-spin"></i>
                        Someone is typing...
                    </div>
                </div>
            </div>

            <!-- Empty State for Mobile -->
            <div class="sm:hidden flex-1 flex items-center justify-center bg-gray-800">
                <div class="text-center">
                    <i data-lucide="message-circle" class="w-16 h-16 mx-auto mb-4 text-gray-600"></i>
                    <p class="text-gray-400">Select a conversation from the list</p>
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript Files -->
    <script src="{% static 'js/messages-api.js' %}"></script>
    <script src="{% static 'js/messages-ui.js' %}"></script>
    <script src="{% static 'js/messages-handlers.js' %}"></script>
</body>
</html>
