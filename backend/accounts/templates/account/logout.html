{% extends "base.html" %}
{% load static %}

{% block title %}Sign Out{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 100px auto; text-align: center; font-family: Arial, sans-serif;">
    <h2>Are you sure you want to sign out?</h2>
    
    <form method="post" action="{% url 'account_logout' %}" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 5px;">
            Sign Out
        </button>
    </form>

    <a href="/" style="display: block; margin-top: 15px; color: #007bff; text-decoration: none;">Cancel and go back to home</a>
</div>
{% endblock %}
